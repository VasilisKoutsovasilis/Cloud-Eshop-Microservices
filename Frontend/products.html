<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products</title>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    
    <div id="navbar" class="navbar"></div>

    <div class="product-cart" id="product-cart">
        <div class="product-grid" id="product-grid"></div>
        
        <div class="register-div">
            <div class="register-new-product" id="register-new-product">
                <div class="register-label">
                    <h3>New Product Registration</h3>
                </div>
    
                <div class="product-inputs">
                    <div class="prod-title">
                        <h4>Title:</h4>
                        <input type="textbox" id="product-title-in" class="product-title-in">
                    </div>
                    <div class="prod-image">
                        <h4>Image:</h4>
                        <input style="width: 200px;" type="file" id="product-image-in" accept="image/png, image/jpeg, image/jpg" class="product-image-in">
                    </div>
    
                    <div class="prod-price">
                        <h4>Price:</h4>
                        <input type="textbox" id="prod-price-in" class="prod-price-in">
                    </div>
    
                    <div class="prod-quantity">
                        <h4>Max Quantity:</h4>
                        <input type="textbox" id="prod-quantity-in" class="prod-quantity-in">
                    </div>
                </div>
    
                <button onclick="addNewProduct()" class="register-prod-btn">Register Product</button>
            </div>
        </div>
        
    </div>
</body>

<script src="./src/products.js"></script>
</html>
